syntax = "proto3";

package polls.v1;

option java_package = "kz.highload.polls.grpc.v1";
option java_multiple_files = true;

service PollService {
  rpc CreatePoll(CreatePollRequest) returns (CreatePollResponse);

  rpc CastVote(CastVoteRequest) returns (CastVoteResponse);

  rpc GetResults(GetResultsRequest) returns (GetResultsResponse);

  rpc GetPoll(GetPollRequest) returns (GetPollResponse);

  rpc ClosePoll(ClosePollRequest) returns (ClosePollResponse);
}

message CreatePollRequest {
  string idempotency_key = 1;
  int32 owner_id = 2;
  string question = 3;
  repeated string options = 4;
  int64 ends_at_epoch_ms = 5;
}

message CreatePollResponse {
  int32 poll_id = 1;
}

message CastVoteRequest {
  int32 poll_id = 1;
  int32 user_id = 2;
  int32 option_id = 3;
}

enum VoteStatus {
  VOTE_STATUS_UNSPECIFIED = 0;
  VOTE_STATUS_ACCEPTED = 1;
  VOTE_STATUS_ALREADY_COUNTED = 2;
}

message CastVoteResponse {
  VoteStatus status = 1;
}

message GetResultsRequest {
  int32 poll_id = 1;
}

message OptionResult {
  int32 option_id = 1;
  string text = 2;
  int64 votes = 3;
  double percent = 4;
}

message GetResultsResponse {
  int32 poll_id = 1;
  int64 total_votes = 2;
  repeated OptionResult options = 3;
}

message GetPollRequest {
  int32 poll_id = 1;
  int32 user_id = 2;
}

message GetPollResponse {
  int32 poll_id = 1;
  int32 owner_id = 2;
  string question = 3;
  repeated string options = 4;
  int64 ends_at_epoch_ms = 5;
  bool open = 6;
  int32 my_option_id = 7;
}

message ClosePollRequest {
  int32 poll_id = 1;
  int32 user_id = 2;
}

message ClosePollResponse {
  int64 ends_at_epoch_ms = 1;
}
